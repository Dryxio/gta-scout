[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-asset-search"
version = "0.1.0a1"
description = "Local evidence-backed GTA asset discovery for humans and AI agents — early alpha"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dryxio"}]
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
semantic = ["sentence-transformers==6.0.1"]

[project.scripts]
asset-catalog = "asset_catalog:main"
asset-catalog-sources = "asset_catalog_sources:main"
asset-catalog-visual = "asset_catalog_visual:main"
asset-catalog-semantic = "asset_catalog_semantic:main"
asset-catalog-shortlist = "asset_catalog_shortlist:main"
asset-catalog-revision = "asset_catalog_revision:main"
asset-catalog-pack = "asset_catalog_pack:main"
asset-catalog-evaluate = "asset_catalog_evaluate:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["asset_catalog", "asset_catalog_dragon", "asset_catalog_sources", "asset_catalog_visual", "asset_catalog_semantic", "asset_catalog_shortlist", "asset_catalog_revision", "asset_catalog_campaign", "asset_catalog_transfer_pixels", "asset_catalog_image_signal", "asset_catalog_uv_context", "asset_catalog_dedupe_cache", "asset_catalog_evaluate", "asset_catalog_pack"]
